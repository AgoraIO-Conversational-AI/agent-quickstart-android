<tspan x="900" dy="0">Agora + on-device RAG + Gemma</tspan>
</text>
<text x="900" y="115" text-anchor="middle" font-size="24" font-weight="normal" class="body" style="fill:#596574">
<tspan x="900" dy="0">Your documents and reasoning stay on Android. Agora brings the conversation to life.</tspan>
</text>
