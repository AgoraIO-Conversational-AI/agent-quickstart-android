<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
<title id="title">Agora + on-device RAG + Gemma: complete architecture</title>
<desc id="desc">Audio goes from Android to Agora ASR. A Python relay sends question text and bounded history to Android. EmbeddingGemma, hybrid retrieval and Gemma generation run on the phone. Partial answer text returns through Python SSE to Agora TTS, and audio returns to the user. Document text, embeddings and retrieved passages stay on the phone.</desc>
<defs>
 <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="0.8" fill="#d4d4d0" opacity=".52"/></pattern>
 <filter id="sketch" x="-3%" y="-3%" width="106%" height="106%"><feTurbulence type="fractalNoise" baseFrequency=".022" numOctaves="2" seed="8" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="1.25" xChannelSelector="R" yChannelSelector="G"/></filter>
 <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#347454" stroke-width="2"/></marker>
 <marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#2675b9" stroke-width="2"/></marker>
 <marker id="arrow-purple" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#8054a4" stroke-width="2"/></marker>
</defs>
<rect width="1800" height="1200" fill="#fffdf8"/><rect width="1800" height="1200" fill="url(#dots)"/>
